      label: Introduction
      type: text
  - name: categories
    label: Catégories (boutons de filtre)
    type: object
    fields:
    - name: id
      label: Identifiant
      type: string
      description: Sans espace ni accent, en minuscules. Ne le changez pas si des photos l'utilisent.
      required: true
    - name: nom
      label: Nom affiché
      type: string
      required: true
    list: true
  - name: photos
    label: Photos de la galerie
    type: object
    fields:
    - name: photo
      label: Photo
      type: image
      description: Glissez la photo ici. Peu importe sa taille, le site la réduit automatiquement.
    - name: alt
      label: Description de la photo
      type: string
      description: Décrivez la photo en une phrase (ex. « Golden retriever sur fond bleu »). Utile pour
        Google et les personnes malvoyantes.
    - name: legende
      label: Légende
      type: string
      description: Affichée dans l'aperçu agrandi.
      required: true
    - name: categorie
      label: Catégorie
      type: string
      description: Doit correspondre à l'identifiant d'une catégorie ci-dessus (studio, exterieur, chiots,
        duo).
      required: true
    list: true
    description: 'Pour ajouter une photo : « Ajouter » en bas de liste. Pour en retirer une : la corbeille
      à côté. Glissez-déposez pour changer l''ordre.'
