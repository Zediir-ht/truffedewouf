        label: Nom de la formule
        type: string
        required: true
      - name: prix
        label: Prix
        type: string
        description: 'Chiffres seulement (ex. 150) : « € » est ajouté tout seul. Ou un texte (ex. Sur
          devis). Vide : « Tarif à venir ».'
      - name: duree
        label: Lieu / durée
        type: string
        description: Ex. Studio · 1 h
      - name: mise_en_avant
        label: Mettre en avant (encadré blanc)
        type: boolean
      - name: inclus
        label: Ce qui est inclus
        type: string
        list: true
        description: Une ligne par élément.
      list: true
    - name: options
      label: Options
      type: object
      fields:
      - name: nom
        label: Option
        type: string
        required: true
      - name: prix
        label: Prix
        type: string
        description: Ex. + 20 €
        required: true
      list: true
      description: Laissez vide pour masquer la ligne des options.
  - name: modalites
    label: Comment ça se passe
    type: object
    fields:
    - name: titre
      label: Titre
      type: string
      description: 'Pour mettre un passage en italique (en couleur), entourez-le d''étoiles : *comme ceci*.'
